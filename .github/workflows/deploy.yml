name: Deploy to AWS

# Manual trigger only - this project's CI (ci.yml) runs on every push/PR and
# is fully self-contained (no cloud credentials needed). This workflow is
# opt-in and only does anything once the AWS resources it assumes already
# exist (see docs/DEPLOYMENT.md) and the repo secrets/variables below are
# configured. It will fail cleanly on a fork or an unconfigured repo rather
# than silently doing nothing.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to build and deploy (defaults to the commit SHA)'
        required: false
        default: ''

permissions:
  id-token: write   # required for OIDC -> AWS role assumption (no static AWS keys stored in the repo)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: Build & push images to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.ECR_REGISTRY }}/jobfit-backend:${{ env.IMAGE_TAG }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          tags: ${{ env.ECR_REGISTRY }}/jobfit-frontend:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy new task definitions to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render backend task definition
        id: render-backend
        run: |
          sed -e "s|<ACCOUNT_ID>|${{ vars.AWS_ACCOUNT_ID }}|g" \
              -e "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" \
              -e "s|<IMAGE_TAG>|${{ needs.build-and-push.outputs.image_tag }}|g" \
              infra/ecs-task-definition.json > backend-task-def.json

      - name: Register & deploy backend task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: backend-task-def.json
          service: jobfit-backend-service
          cluster: jobfit-cluster
          wait-for-service-stability: true

      - name: Render frontend task definition
        id: render-frontend
        run: |
          sed -e "s|<ACCOUNT_ID>|${{ vars.AWS_ACCOUNT_ID }}|g" \
              -e "s|<AWS_REGION>|${{ env.AWS_REGION }}|g" \
              -e "s|<IMAGE_TAG>|${{ needs.build-and-push.outputs.image_tag }}|g" \
              infra/ecs-task-definition-frontend.json > frontend-task-def.json

      - name: Register & deploy frontend task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: frontend-task-def.json
          service: jobfit-frontend-service
          cluster: jobfit-cluster
          wait-for-service-stability: true

      - name: Run database migrations
        run: |
          echo "Flyway migrations run automatically on backend container startup (spring.flyway.enabled=true)."
          echo "No separate migration step needed - see application.yml."
