services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobfit
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
    ports:
      - "5433:5432"
    volumes:
      - jobfit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobfit
      DB_USERNAME: jobfit
      DB_PASSWORD: jobfit
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-this-must-be-32-bytes-min}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  jobfit_pg_data:
