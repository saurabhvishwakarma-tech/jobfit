spring:
  application:
    name: jobfit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobfit}
    username: ${DB_USERNAME:jobfit}
    password: ${DB_PASSWORD:jobfit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  error:
    # The default Spring Boot /error fallback (only reached for errors outside
    # normal controller dispatch - filter exceptions, unmapped routes) should
    # never echo internal exception text. Everything reachable through our own
    # controllers already goes through GlobalExceptionHandler, which builds its
    # own safe, human-written message - this setting only affects the fallback.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

jobfit:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-prod-this-must-be-at-least-256-bits-long}
      access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
      refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
    rate-limit:
      auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MIN:20}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    provider: ${STORAGE_PROVIDER:local}   # local | s3
    local-base-path: ${STORAGE_LOCAL_PATH:./data/resumes}
    s3-bucket: ${STORAGE_S3_BUCKET:jobfit-resumes}
  ai:
    provider: ${AI_PROVIDER:stub}         # stub | openai | anthropic
    api-key: ${AI_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info    # never expose the full actuator surface (env, beans, etc.) publicly
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness, for the ECS task health check
      show-details: never       # status only (UP/DOWN) - no dependency detail leaked to unauthenticated callers
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.jobfit: INFO
    org.springframework.security: WARN
  pattern:
    # No request bodies/headers/tokens in any of our own log statements (see
    # JwtAuthenticationFilter, AuthService) - this pattern just standardizes format.
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
