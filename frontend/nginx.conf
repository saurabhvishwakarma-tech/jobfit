server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA shell - it references hashed asset filenames, so we
    # need every deploy to be picked up immediately. The hashed assets
    # themselves (below) are safe to cache forever.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing (react-router) - any path that isn't a real static
    # file falls back to index.html so a hard refresh on e.g. /jobs/12 works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening - this is a static bundle, not an API, so a tight CSP is
    # safe here. Backend calls go directly to VITE_API_BASE_URL, not through
    # this server, so no reverse-proxy rules are needed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
